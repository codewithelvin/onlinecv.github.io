name: CI & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a new push cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- Quality gate: format + lint + typecheck + tests (spec §21/§25/§28) ----
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # First, because it is the cheapest of the four and the easiest to fix. It is
      # also safe to pin to LF here: `.gitattributes` sets `eol=lf`, so the runner's
      # checkout and a Windows working tree give Prettier the same bytes.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  # ---- Build the static site ----
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The analytics ids (§20/§22) come from the committed `.env.production`, not
      # from repository secrets. They are public identifiers that ship in the
      # bundle either way, and passing them here as `${{ secrets.X }}` was an
      # active hazard: an unset secret expands to an EMPTY STRING, and an inline
      # `VITE_*` env var outranks every `.env` file in Vite — so a checkout without
      # the secrets configured would quietly build with analytics disabled.
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---- Deploy to GitHub Pages ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
