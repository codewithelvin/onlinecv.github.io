<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1877F2" />

    <title>OnlineCV — Pulsuz onlayn CV yarat</title>
    <meta
      name="description"
      content="CV hazırlamaq üçün online platforma. Pulsuz olaraq CV-nizi bir neçə dəqiqəyə hazırlayıb PDF kimi endirin. Bütün məlumatlar yalnız sizin cihazınızda saxlanılır."
    />
    <link rel="canonical" href="https://onlinecv.az/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlineCV" />
    <meta property="og:title" content="OnlineCV — Pulsuz onlayn CV yarat" />
    <meta
      property="og:description"
      content="ATS-uyğun CV-nizi brauzerdə hazırlayıb PDF kimi endirin. Qeydiyyat yoxdur, məlumatlar cihazınızda qalır."
    />
    <meta property="og:url" content="https://onlinecv.az/" />
    <!--
      1200×630 (1.91:1) — the shape every network that renders a LARGE card
      expects. This used to point at pwa/logo512.png, a 512×512 app icon, which
      those networks letterbox or centre-crop into a badge. Regenerate it with
      `npx vite-node scripts/make-og-image.ts`; it reads the template and locale
      registries, so the counts on it cannot fall behind the app.
    -->
    <meta property="og:image" content="https://onlinecv.az/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OnlineCV — pulsuz, ATS-uyğun onlayn CV qurucusu" />

    <!-- Twitter -->
    <!-- `summary_large_image`, now that og:image is actually 1.91:1. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OnlineCV — Pulsuz onlayn CV yarat" />
    <meta
      name="twitter:description"
      content="ATS-uyğun CV-nizi brauzerdə hazırlayıb PDF kimi endirin."
    />
    <meta name="twitter:image" content="https://onlinecv.az/og-image.jpg" />

    <!-- JSON-LD (WebSite + Organization) is injected at runtime by src/app/seo.ts -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Portal host for modals. See src/utils/modal-container.ts: mounting them
         here instead of straight into <body> keeps Ant Design from locking body
         scroll, which would otherwise re-anchor the sticky preview pane. -->
    <div id="modal-root"></div>
    <noscript>OnlineCV işləməsi üçün JavaScript aktiv olmalıdır.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
